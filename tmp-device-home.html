        function onElementHeightChange(elm, callback){
            var lastHeight = elm.innerHeight, newHeight;
    
            (function run(){
                newHeight = elm.innerHeight;
                if( lastHeight != newHeight )
                    callback(newHeight);
                lastHeight = newHeight;

                if( elm.onElementHeightChangeTimer )
                    clearTimeout(elm.onElementHeightChangeTimer);

                elm.onElementHeightChangeTimer = setTimeout(run, 200);
            })();
        }

        function onElementWidthChange(elm, callback){
            var lastWidth = elm.clientWidth, newWidth;
            (function run(){
                newWidth = elm.clientWidth;
                if( lastWidth != newWidth )
                    callback(newWidth);
                lastWidth = newWidth;

                if( elm.onElementHeightChangeTimer )
                    clearTimeout(elm.onElementHeightChangeTimer);

                var start, iterate, timeout;

                this.start = function () {
                    if (!iterate) {
                        start = + new Date;
                        iterate = true;
                        loop();
                    }
                };

                this.stop = function () {
                    if (iterate) {
                        clearTimeout(timeout);
                        iterate = false;
                    }
                };

                    var element = array.shift();
                    callback(element, new Date - start);

                    if (iterate) timeout = setTimeout(loop, interval);
                }
            }
